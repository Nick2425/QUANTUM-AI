# Qaggle system registry: the single source of truth for per-system data.
#
# Read with the standard-library ``tomllib`` by dfthc/dfthc_u_to_tei.py
# (OPTIMIZED_SOLUTIONS, FCIDUMP_FILES, UPPER_ENERGIES) and by
# starter/task1_factorization/train_df_thc_qaggle.py (SYSTEMS).
#
# Fields
#   fcidump        file name under data/integrals/
#   orbitals       N, number of spatial orbitals
#   electrons      eta, number of electrons
#   upper_energy   E_upper (Hartree), upper bound on the ground-state energy
#   baseline       provided factorization NPZ under baselines/ (read-only)
#   rank, bases, copies
#                  (R, B, C) of the baseline factorization
#   competition    true for systems in the competition set (N <= 58)

